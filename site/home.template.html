<section class="intro" aria-labelledby="name">
  <h1 id="name" aria-label="$name">$animated_name</h1>
  <div class="intro-details">
    <ul class="roles">$current_roles</ul>
    <p class="bio">$bio</p>
  </div>
  <div class="profile-links">
    <a class="cv-link" href="${asset_prefix}cv/seungyeol-ryu-cv.pdf" download="Seungyeol-Ryu-CV.pdf">$cv_label <span>(PDF)</span></a>
    $social_links
  </div>
  <img class="portrait" src="${asset_prefix}assets/portrait.webp" alt="$portrait_label" width="354" height="472">
</section>
<div class="home-index">
  $index
</div>
