<!doctype html>
<html lang="$language">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#faf9f6">
  <title>$page_title</title>
  <link rel="alternate" hreflang="en" href="$english_url">
  <link rel="alternate" hreflang="ko" href="$korean_url">
  <link rel="stylesheet" href="${asset_prefix}assets/site.css?v=$asset_version">
  <link rel="stylesheet" href="${asset_prefix}assets/projects.css?v=$asset_version">
  <script src="${asset_prefix}assets/site.js?v=$asset_version" defer></script>
</head>
<body id="top">
  <div class="reading-progress" aria-hidden="true"></div>
  <a class="skip" href="#main">$skip_label</a>
  <div class="page">
    <header class="masthead">
      <a class="wordmark" href="$home_href" lang="ko">$korean_name</a>
      <nav class="language-switch" aria-label="$language_label">
        <span class="language-indicator" aria-hidden="true"></span>
        <a href="$english_path" lang="en" hreflang="en" aria-label="English"$english_current>EN</a>
        <a href="$korean_path" lang="ko" hreflang="ko"$korean_current>한국어</a>
      </nav>
      <nav class="site-nav" aria-label="$sections_label">
        $navigation
      </nav>
    </header>

    <main id="main">
      $body
    </main>
    <footer>
      <a href="#top">$top_label</a>
    </footer>
  </div>
</body>
</html>
