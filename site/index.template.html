<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#102748">
  <title>$name | Research and portfolio</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="hero" id="top">
    <div class="wrap">
      <nav class="topbar" aria-label="Main navigation">
        <a class="wordmark" href="#top" lang="ko">$korean_name</a>
        <div class="nav-links">
          <a href="#research">Research</a>
          <a href="#projects">Projects</a>
          <a href="#profile">Profile</a>
          <a href="cv/seungyeol-ryu-cv.pdf" class="nav-cv">CV <span>PDF</span></a>
        </div>
      </nav>
      <div class="hero-main">
        <div class="hero-copy">
          <h1>$name</h1>
          <p class="affiliation">$role at $university</p>
          <p class="bio">$bio</p>
          <div class="hero-links">
            <a class="primary" href="cv/seungyeol-ryu-cv.pdf" download="Seungyeol-Ryu-CV.pdf">Download CV <span aria-hidden="true">↓</span></a>
            $social_links
          </div>
        </div>
        <figure class="portrait">
          <img src="assets/portrait.webp" alt="Portrait of $name" width="354" height="472" fetchpriority="high">
          <figcaption>$lab</figcaption>
        </figure>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="research" class="wrap section">
      <div class="section-title">
        <h2>Research</h2>
        <ul class="topics" aria-label="Research interests">$topics</ul>
      </div>
      <div class="research-list">$research</div>
    </section>
    <section id="projects" class="projects-section">
      <div class="wrap section">
        <div class="section-title"><h2>Selected projects</h2></div>
        <div class="projects">$projects</div>
      </div>
    </section>
    <section id="profile" class="wrap section profile">
      <div class="section-title"><h2>Profile</h2></div>
      <div class="profile-grid">
        <div>
          <h3>Education</h3>
          <dl class="timeline">$education</dl>
        </div>
        <div>
          <h3>Research experience</h3>
          <dl class="timeline">$experience</dl>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <span>$name</span>
      <div class="footer-links">$social_links <a href="cv/seungyeol-ryu-cv.pdf">CV (PDF)</a></div>
    </div>
  </footer>
</body>
</html>
